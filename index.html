<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penilaian Pejuang Kepondokan Al-Bahjah Cabang Cirebon 1</title>
    <meta name="description" content="Sistem Digitalisasi Form Checklist Pengurus Kepondokan &amp; Pejuang Al-Bahjah dengan Analytics Performa, Kalender Hijriyah &amp; Laporan Real-Time." />
    <meta property="og:title" content="Penilaian Pejuang Kepondokan Al-Bahjah Cabang Cirebon 1" />
    <meta property="og:description" content="Sistem Digitalisasi Form Checklist Pengurus Kepondokan &amp; Pejuang Al-Bahjah dengan Analytics Performa, Kalender Hijriyah &amp; Laporan Real-Time." />
    <meta property="og:image" content="/pwa-512x512.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link id="app-favicon" rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link id="app-apple-icon" rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Al-Bahjah" />
    <script>
      (function() {
        try {
          var savedLogo = localStorage.getItem("APP_LOGO");
          if (savedLogo) {
            var oldLinks = document.querySelectorAll("link[rel*='icon'], link[rel*='apple-touch-icon']");
            oldLinks.forEach(function(l) { l.remove(); });
            var isSvg = savedLogo.indexOf("data:image/svg") === 0 || savedLogo.indexOf(".svg") > -1;
            var mime = isSvg ? "image/svg+xml" : "image/png";
            
            var link = document.createElement("link");
            link.id = "app-favicon";
            link.rel = "icon";
            link.type = mime;
            link.href = savedLogo;
            document.head.appendChild(link);

            var shortcut = document.createElement("link");
            shortcut.rel = "shortcut icon";
            shortcut.type = mime;
            shortcut.href = savedLogo;
            document.head.appendChild(shortcut);

            var apple = document.createElement("link");
            apple.id = "app-apple-icon";
            apple.rel = "apple-touch-icon";
            apple.href = savedLogo;
            document.head.appendChild(apple);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
